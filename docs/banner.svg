<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="78%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#0b3d91" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1b1f23" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="#1b1f23"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <rect width="1200" height="420" fill="url(#glow)"/>

  <!-- decorative commit graph, bottom right -->
  <g stroke="#1f6feb" stroke-width="1.5" opacity="0.55">
    <line x1="960" y1="120" x2="1050" y2="90"/>
    <line x1="1050" y1="90" x2="1130" y2="140"/>
    <line x1="960" y1="120" x2="1010" y2="210"/>
    <line x1="1010" y1="210" x2="1130" y2="140"/>
    <line x1="1010" y1="210" x2="1080" y2="280"/>
    <line x1="1130" y1="140" x2="1080" y2="280"/>
  </g>
  <g fill="#58a6ff">
    <circle cx="960" cy="120" r="6"/>
    <circle cx="1050" cy="90" r="5"/>
    <circle cx="1130" cy="140" r="6"/>
    <circle cx="1010" cy="210" r="7"/>
    <circle cx="1080" cy="280" r="5"/>
  </g>

  <text x="70" y="120" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#58a6ff">
    BAIL308C &#183; PROJECT MANAGEMENT WITH GIT
  </text>

  <text x="68" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="80" font-weight="700" fill="#ffffff">
    <tspan fill="#1f6feb">Git</tspan> &amp; <tspan fill="#1f6feb">GitHub</tspan>
  </text>
  <text x="70" y="275" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="600" fill="#ffffff">
    Viva Preparation
  </text>

  <text x="70" y="325" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#c9d1d9">
    Flashcards, a quiz, a debugging drill, and a full command reference,
  </text>
  <text x="70" y="352" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#c9d1d9">
    covering all five sessions and twelve lab experiments.
  </text>

  <g transform="translate(70, 378)">
    <rect width="130" height="28" rx="14" fill="#1f6feb"/>
    <text x="65" y="19" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Next.js 16</text>
  </g>
  <g transform="translate(212, 378)">
    <rect width="150" height="28" rx="14" fill="none" stroke="#333a43"/>
    <text x="75" y="19" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#c9d1d9" text-anchor="middle">Tailwind CSS v4</text>
  </g>
  <g transform="translate(374, 378)">
    <rect width="146" height="28" rx="14" fill="none" stroke="#333a43"/>
    <text x="73" y="19" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#c9d1d9" text-anchor="middle">Framer Motion</text>
  </g>
</svg>
