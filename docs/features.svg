<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="300" fill="#f6f8fa"/>

  <!-- card template repeated 4 times via groups -->
  <!-- Flashcards -->
  <g transform="translate(40, 30)">
    <rect width="266" height="240" rx="16" fill="#ffffff" stroke="#d0d7de"/>
    <circle cx="44" cy="52" r="22" fill="#1f6feb"/>
    <rect x="33" y="42" width="18" height="13" rx="2" fill="#ffffff" opacity="0.9" transform="rotate(-8 44 52)"/>
    <rect x="35" y="45" width="18" height="13" rx="2" fill="#ffffff" transform="rotate(4 44 52)"/>
    <text x="34" y="106" font-family="Georgia, serif" font-size="21" font-weight="700" fill="#1b1f23">Flashcards</text>
    <text x="34" y="134" font-family="Arial, sans-serif" font-size="13" fill="#6a737d">
      <tspan x="34" dy="0">Flip through Q&amp;A pairs,</tspan>
      <tspan x="34" dy="18">grouped by session.</tspan>
    </text>
    <rect x="34" y="196" width="80" height="24" rx="12" fill="#f6f8fa"/>
    <text x="74" y="212" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#6a737d" text-anchor="middle">49 cards</text>
  </g>

  <!-- Quiz -->
  <g transform="translate(326, 30)">
    <rect width="266" height="240" rx="16" fill="#ffffff" stroke="#d0d7de"/>
    <circle cx="44" cy="52" r="22" fill="#1f6feb"/>
    <path d="M34 52 L41 59 L55 44" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="34" y="106" font-family="Georgia, serif" font-size="21" font-weight="700" fill="#1b1f23">Quiz Mode</text>
    <text x="34" y="134" font-family="Arial, sans-serif" font-size="13" fill="#6a737d">
      <tspan x="34" dy="0">Multiple choice with</tspan>
      <tspan x="34" dy="18">instant feedback.</tspan>
    </text>
    <rect x="34" y="196" width="110" height="24" rx="12" fill="#f6f8fa"/>
    <text x="89" y="212" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#6a737d" text-anchor="middle">20 questions</text>
  </g>

  <!-- Debug It -->
  <g transform="translate(612, 30)">
    <rect width="266" height="240" rx="16" fill="#ffffff" stroke="#d0d7de"/>
    <circle cx="44" cy="52" r="22" fill="#1f6feb"/>
    <text x="44" y="59" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
    <text x="34" y="106" font-family="Georgia, serif" font-size="21" font-weight="700" fill="#1b1f23">Debug It</text>
    <text x="34" y="134" font-family="Arial, sans-serif" font-size="13" fill="#6a737d">
      <tspan x="34" dy="0">Real error messages,</tspan>
      <tspan x="34" dy="18">diagnose the fix.</tspan>
    </text>
    <rect x="34" y="196" width="110" height="24" rx="12" fill="#f6f8fa"/>
    <text x="89" y="212" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#6a737d" text-anchor="middle">6 scenarios</text>
  </g>

  <!-- Cheat Sheet -->
  <g transform="translate(898, 30)">
    <rect width="262" height="240" rx="16" fill="#ffffff" stroke="#d0d7de"/>
    <circle cx="44" cy="52" r="22" fill="#1f6feb"/>
    <line x1="34" y1="46" x2="54" y2="46" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="34" y1="53" x2="54" y2="53" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="34" y1="60" x2="46" y2="60" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text x="34" y="106" font-family="Georgia, serif" font-size="21" font-weight="700" fill="#1b1f23">Cheat Sheet</text>
    <text x="34" y="134" font-family="Arial, sans-serif" font-size="13" fill="#6a737d">
      <tspan x="34" dy="0">Searchable, copyable</tspan>
      <tspan x="34" dy="18">command reference.</tspan>
    </text>
    <rect x="34" y="196" width="120" height="24" rx="12" fill="#f6f8fa"/>
    <text x="94" y="212" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#6a737d" text-anchor="middle">26 commands</text>
  </g>
</svg>
